# Caso de referencia (probeta_1, 40 MPa): son los valores por defecto del motor.
# Copie este archivo, cambie lo que necesite y ejecute: ./triaxial_cuda_native --caso casos/mi_caso.cfg
# Las claves que no aparezcan toman el valor por defecto; clave=valor en la línea de comandos tiene prioridad.

# --- ejecución ---
pasos              = 200000                 # pasos dinámicos a simular
salida             = resultados/cuda_gpu    # directorio de salida
sobrescribir       = 0                      # 1 = permite escribir sobre una salida existente (facet_force_exact.txt)
contactos          = dinamicos              # dinamicos (lista de Verlet) | estaticos (lista fija de t=0)
gpu                = 0                      # índice de la GPU (variable de entorno: DEM_GPU)
arch               = auto                   # arquitectura NVRTC (auto = la de la GPU, p. ej. 89 para compute_89) (variable de entorno: DEM_ARCH)
fp32               = 0                      # 1 = ley de contacto en FP32 (por defecto FP64) (variable de entorno: DEM_FP32)
atomics            = 0                      # 1 = suma de fuerzas con atomicAdd (no reproducible) (variable de entorno: DEM_ATOMICS)
parar_eps1         = 0                      # detener al superar esta deformación axial (fracción, 0 = no)
parar_caida_q      = 0                      # detener cuando q cae a (1 - valor)·q_pico tras el pico (0 = no)
parada_yade        = 1                      # 1 = parada automática de checkProgress() de YADE (fractura: fz < fraccion·fz_max; sigue hasta t = (1+extra)·t_fractura)
parada_fraccion    = 0.7                    # parada_yade: fractura cuando fz/fz_max < fraccion
parada_extra       = 0.05                   # parada_yade: tras la fractura se sigue hasta O.time >= (1+extra)·t_fractura
parada_fz_min      = 2000                   # parada_yade: solo si fz_max > este valor [N]

# --- entrada ---
geo                = inputs/probeta_1.geo   # probeta (.geo de gengeo: x y z r id tipo tras BeginParticles) (variable de entorno: DEM_GEO)
enlaces            =                        # archivo de enlaces (vacío = calcularlos como YADE con intRadius) (variable de entorno: DEM_BONDS)
intRadius          = 1.3                    # factor de detección de enlaces: d <= intRadius·(ri+rj) (variable de entorno: DEM_INTRADIUS)
recentrar          = auto                   # auto | 1 | 0: trasladar la probeta al eje z si su centro está desplazado
perturb_seed       = 0                      # semilla de perturbación de posiciones (0 = sin perturbar) (variable de entorno: DEM_PERTURB_SEED)
perturb_amp        = 1e-9                   # amplitud de la perturbación (fracción del radio) (variable de entorno: DEM_PERTURB_AMP)

# --- material IBM (mismos nombres que test-4-triaxial-opt.py) ---
young              = 6.671e10               # módulo de Young de las partículas [Pa]
kn_ks_ratio        = 25.0                   # kn/ks partícula-partícula
tensile            = 9.62e6                 # resistencia a tracción del enlace [Pa]
cohesion           = 6.704e7                # cohesión del enlace [Pa]
tgPhi              = 0.466                  # tan(phi) del criterio de Mohr-Coulomb del enlace
mu                 = 0.466                  # fricción de contacto (partícula-partícula y partícula-pared)
density            = 1.00e8                 # densidad [kg/m3] (escalada)
rollFric           = 0.100                  # coeficiente de rodadura
bendingIn          = 1.000                  # factor de rigidez a flexión
viscAlpha          = 0.100                  # amortiguamiento viscoso normal (fracción del crítico)
damping            = 0.01                   # amortiguamiento de Cundall (NewtonIntegrator)
young_wall         = 1.00e10                # módulo de Young de las facetas [Pa]
kn_ks_wall_ratio   = 2.5                    # kn/ks de las facetas
dt_factor          = 0.5                    # dt = dt_factor · r_min·sqrt(density/young)

# --- ensayo ---
confining          = 4.00e7                 # presión de confinamiento [Pa]
z_vel              = 1.0e-5                 # velocidad de cada plato en la carga desviadora [m/s] (precarga: 2·z_vel) (variable de entorno: TRIAX_ZVEL)
r_vel_max_factor   = 3.0                    # velocidad radial máxima del servo = factor·z_vel
servo_preload      = 50                     # periodo del servo en la precarga (10 = corrida de referencia resultados/yade_cpu) (variable de entorno: TRIAX_SERVO_PRELOAD)
servo_period       = 50                     # periodo del servo en la carga desviadora
preload_hold       = 50                     # comprobaciones (cada 100 iter) que se mantiene el confinamiento antes de cargar

# --- contorno ---
plate_n_radial     = 10                     # divisiones radiales de cada plato
plate_n_angular    = 24                     # divisiones angulares de cada plato
plate_R_factor     = 1.05                   # radio del plato = factor·R_probeta
n_s                = 24                     # segmentos angulares de la membrana
n_h                = auto                   # anillos de la membrana (auto = fórmula de YADE: max(20, min(40, ceil(L/(10·r_max)))))

# --- contactos y salida ---
skin_factor        = 0.3                    # skin de Verlet = factor·r_min (variable de entorno: CONTACT_SKIN_FACTOR)
contact_verify     = 0                      # cada N pasos cuenta contactos perdidos (0 = no) (variable de entorno: CONTACT_VERIFY)
vtk_every          = 0                      # exportar VTK cada N iteraciones (0 = no) (variable de entorno: DEM_VTK_EVERY)
vtk_ascii          = 0                      # 1 = VTK en ASCII (variable de entorno: DEM_VTK_ASCII)
vtk_intrs          = 1                      # 0 = no exportar interacciones (variable de entorno: DEM_VTK_INTRS)
